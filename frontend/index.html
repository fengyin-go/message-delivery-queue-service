<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消息队列系统</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f6fa; color: #333; }
    header { background: #1a1a2e; color: #fff; padding: 16px 24px; }
    header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { margin: 0 0 12px; font-size: 16px; color: #444; }
    .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
    .stat:last-child { border-bottom: none; }
    .stat .label { color: #666; }
    .stat .value { font-weight: 600; color: #1a1a2e; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
    th { background: #fafafa; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
    .badge-pending { background: #fff3cd; color: #856404; }
    .badge-delivered { background: #d1ecf1; color: #0c5460; }
    .badge-acknowledged { background: #d4edda; color: #155724; }
    .badge-dead { background: #f8d7da; color: #721c24; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 8px 16px; border: none; border-radius: 4px; background: #e4e6eb; cursor: pointer; }
    .tab.active { background: #2563eb; color: #fff; }
    .section { display: none; }
    .section.active { display: block; }
    .empty { color: #999; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <header><h1>消息队列系统</h1></header>
  <div class="container">
    <div class="grid" id="stats"></div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('topics')">主题</button>
      <button class="tab" onclick="showTab('messages')">消息</button>
      <button class="tab" onclick="showTab('dead-letters')">死信</button>
    </div>
    <div id="topics" class="section active">
      <div class="card"><h2>主题列表</h2><div id="topics-table"></div></div>
    </div>
    <div id="messages" class="section">
      <div class="card"><h2>消息列表</h2><div id="messages-table"></div></div>
    </div>
    <div id="dead-letters" class="section">
      <div class="card"><h2>死信列表</h2><div id="dead-letters-table"></div></div>
    </div>
  </div>
  <script>
    const TOKEN = 'mq-demo-token';
    const HEADERS = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };

    async function get(path) {
      const res = await fetch(path, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
      return res.json();
    }

    function renderStats(data) {
      const html = `
        <div class="card"><h2>全局统计</h2>
          <div class="stat"><span class="label">主题数</span><span class="value">${data.topic_count}</span></div>
          <div class="stat"><span class="label">消息数</span><span class="value">${data.message_count}</span></div>
          <div class="stat"><span class="label">待处理</span><span class="value">${data.pending_count}</span></div>
          <div class="stat"><span class="label">已投递</span><span class="value">${data.delivered_count}</span></div>
          <div class="stat"><span class="label">已确认</span><span class="value">${data.acked_count}</span></div>
          <div class="stat"><span class="label">死信数</span><span class="value">${data.dead_letter_count}</span></div>
        </div>`;
      document.getElementById('stats').innerHTML = html;
    }

    function badgeClass(status) {
      const map = { pending: 'badge-pending', delivered: 'badge-delivered', acknowledged: 'badge-acknowledged', dead: 'badge-dead' };
      return map[status] || '';
    }

    function renderTable(containerId, headers, rows, rowFn) {
      const el = document.getElementById(containerId);
      if (!rows || rows.length === 0) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
      let html = '<table><thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
      html += rows.map(rowFn).join('');
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    async function load() {
      const stats = await get('/api/stats/global');
      if (stats.code === 0) renderStats(stats.data);

      const topics = await get('/api/topics?page=1&size=10');
      const topicRows = (topics.data && topics.data.items) || [];
      renderTable('topics-table', ['ID', '名称', '分区数', '状态', '创建时间'], topicRows, t =>
        `<tr><td>${t.id}</td><td>${t.name}</td><td>${t.partitions}</td><td>${t.status}</td><td>${new Date(t.created_at).toLocaleString()}</td></tr>`);

      const messages = await get('/api/messages?page=1&size=10');
      const msgRows = (messages.data && messages.data.items) || [];
      renderTable('messages-table', ['ID', '主题', '分区', '状态', '重试次数'], msgRows, m =>
        `<tr><td>${m.id}</td><td>${m.topic_id}</td><td>${m.partition}</td><td><span class="badge ${badgeClass(m.status)}">${m.status}</span></td><td>${m.attempts}</td></tr>`);

      const dls = await get('/api/dead-letters?page=1&size=10');
      const dlRows = (dls.data && dls.data.items) || [];
      renderTable('dead-letters-table', ['ID', '消息ID', '主题', '原因', '转入时间'], dlRows, d =>
        `<tr><td>${d.id}</td><td>${d.message_id}</td><td>${d.topic_id}</td><td>${d.reason}</td><td>${new Date(d.moved_at).toLocaleString()}</td></tr>`);
    }

    function showTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(name).classList.add('active');
    }

    load();
  </script>
</body>
</html>
